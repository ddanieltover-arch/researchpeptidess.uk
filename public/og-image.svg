<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="og-brand-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4353FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="og-text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="og-blue-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4353FF" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="950" cy="315" r="280" fill="url(#og-brand-glow)" />

  <!-- Left Content -->
  <g transform="translate(100, 160)">
    <!-- Badge -->
    <rect width="280" height="36" rx="18" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#38BDF8" />
    <text x="35" y="23" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">
      ANALYTICAL PURITY &gt; 99%
    </text>

    <!-- Main Title -->
    <text x="0" y="90" fill="url(#og-text-gradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Research Peptides UK
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
      ISO 9001 Synthesized In-Vitro Reference Standards
    </text>
    <text x="0" y="180" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">
      HPLC Tested • MS Verified • UK Tracked 24 Delivery
    </text>

    <!-- Domain Footer -->
    <text x="0" y="270" fill="#64748B" font-family="monospace" font-size="16">
      https://researchpeptidess.uk
    </text>
  </g>

  <!-- Right Logo Badge -->
  <g transform="translate(800, 165) scale(0.6)">
    <!-- Concentric Background Plate -->
    <circle cx="256" cy="256" r="240" fill="#0B132B" stroke="#1E293B" stroke-width="4" />
    
    <!-- Concentric Sky Blue Ring -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="#38BDF8" stroke-width="16" />
    
    <!-- RP Emblem -->
    <text x="256" y="265" fill="#4353FF" font-family="system-ui, -apple-system, sans-serif" font-size="150" font-weight="900" text-anchor="middle" dominant-baseline="central">
      RP
    </text>

    <!-- Decorative Nodes -->
    <circle cx="56" cy="256" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="4" />
    <circle cx="456" cy="256" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="4" />
  </g>
</svg>
