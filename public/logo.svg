<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Top arc path for text -->
    <path id="top-arc" d="M 64,256 A 192,192 0 0,1 448,256" fill="none" />
    <!-- Bottom arc path for text -->
    <path id="bottom-arc" d="M 448,256 A 192,192 0 0,1 64,256" fill="none" />
    
    <!-- Subtle gradient for inner ring -->
    <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="rp-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4353FF" />
      <stop offset="100%" stop-color="#3B52E8" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Clean Background (transparent for versatile rendering) -->
  
  <!-- Outer Circular Text Ring -->
  <g fill="#4353FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5">
    <!-- Top Text -->
    <text>
      <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
        Research Peptides UK
      </textPath>
    </text>

    <!-- Bottom Text (Rotated/inverted along bottom perimeter) -->
    <text>
      <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
        Research Peptides UK
      </textPath>
    </text>
  </g>

  <!-- Left Side Node -->
  <circle cx="56" cy="256" r="10" fill="#0284C7" stroke="#38BDF8" stroke-width="3" filter="url(#glow)" />
  <line x1="42" y1="256" x2="70" y2="256" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

  <!-- Right Side Node -->
  <circle cx="456" cy="256" r="10" fill="#0284C7" stroke="#38BDF8" stroke-width="3" filter="url(#glow)" />
  <line x1="442" y1="256" x2="470" y2="256" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

  <!-- Inner Concentric Ring -->
  <circle cx="256" cy="256" r="146" fill="none" stroke="url(#ring-gradient)" stroke-width="12" stroke-linecap="round" />

  <!-- Central "RP" Emblem -->
  <text 
    x="256" 
    y="262" 
    fill="url(#rp-gradient)" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif" 
    font-size="142" 
    font-weight="900" 
    letter-spacing="-2"
    text-anchor="middle" 
    dominant-baseline="central"
  >
    RP
  </text>
</svg>
